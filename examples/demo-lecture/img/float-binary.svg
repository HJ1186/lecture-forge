<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="Consolas, 'Cascadia Mono', 'Microsoft YaHei', monospace">
  <rect width="880" height="300" fill="#ffffff"/>
  <text x="24" y="40" font-size="17" fill="#1f2328">0.1 在内存里的样子（双精度，53 位有效数字）</text>

  <text x="24" y="86" font-size="19" fill="#1f2328">0.1 = 0.</text>
  <text x="78" y="86" font-size="19" fill="#1f4e79">0001100110011001100110011001100110011001100110011001</text>
  <text x="720" y="86" font-size="19" fill="#c2410c">100110011…</text>

  <line x1="76" y1="100" x2="714" y2="100" stroke="#1f4e79" stroke-width="2"/>
  <text x="76" y="124" font-size="13" fill="#1f4e79">◀ 这 52 位真的存进去了</text>

  <line x1="716" y1="100" x2="872" y2="100" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="716" y="124" font-size="13" fill="#c2410c">◀ 这部分被舍掉（还有无穷多位）</text>

  <text x="24" y="178" font-size="15" fill="#3d4b57">十进制里写不完的小数（1/10、1/3、1/7）到了二进制照样写不完；</text>
  <text x="24" y="204" font-size="15" fill="#3d4b57">只有分母是 2 的幂（0.5、0.25、0.125）才能被精确存放。</text>

  <rect x="24" y="228" width="828" height="46" rx="8" fill="#fff8e8" stroke="#d9a441"/>
  <text x="38" y="257" font-size="15" fill="#7a4f00">舍入发生在"输入那一刻"，之后的每一次加法都在拿一个已经偏大的数在算。</text>
</svg>
